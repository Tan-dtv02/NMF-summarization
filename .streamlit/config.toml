[server]
# Cho phép phục vụ tệp trong app/static (phông chữ).
enableStaticServing = true

[client]
# Ẩn nút Deploy và thực đơn dành cho người lập trình.
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
